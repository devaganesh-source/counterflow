AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  CounterFlow serverless infrastructure.
  DynamoDB + Lambda + Step Functions + API Gateway.

# ============================================================
# Parameters
# ============================================================

Parameters:
  DemoToken:
    Type: String
    Description: Token used for authenticating demo API requests.
    Default: ""

# ============================================================
# Globals
# ============================================================

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256

    Environment:
      Variables:
        TABLE_NAME: !Ref CounterFlowTable


Resources:

  # ============================================================
  # DynamoDB
  # ============================================================

  CounterFlowTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S

        - AttributeName: SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH

        - AttributeName: SK
          KeyType: RANGE

      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true


  # ============================================================
  # API Gateway
  # ============================================================

  CounterFlowApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev

      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Demo-Token'"
        AllowOrigin: "'*'"

      # Protect the public demo API from accidental request floods.
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          DataTraceEnabled: false
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5


  # ============================================================
  # Checkout Lambdas
  # ============================================================

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: services.create_order.app.lambda_handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CounterFlowTable


  ReserveInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: services.reserve_inventory.app.lambda_handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CounterFlowTable


  ChargePaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: services.charge_payment.app.lambda_handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CounterFlowTable


  ConfirmOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: services.confirm_order.app.lambda_handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CounterFlowTable


  # ============================================================
  # Invariant Checker
  # ============================================================

  InvariantCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/invariant_checker/
      Handler: app.lambda_handler

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CounterFlowTable


  # ============================================================
  # Step Functions
  # ============================================================

  CheckoutStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:

      DefinitionUri: statemachines/checkout.asl.json

      DefinitionSubstitutions:
        CreateOrderFunctionArn: !GetAtt CreateOrderFunction.Arn
        ReserveInventoryFunctionArn: !GetAtt ReserveInventoryFunction.Arn
        ChargePaymentFunctionArn: !GetAtt ChargePaymentFunction.Arn
        ConfirmOrderFunctionArn: !GetAtt ConfirmOrderFunction.Arn
        InvariantCheckerFunctionArn: !GetAtt InvariantCheckerFunction.Arn

      Policies:

        - LambdaInvokePolicy:
            FunctionName: !Ref CreateOrderFunction

        - LambdaInvokePolicy:
            FunctionName: !Ref ReserveInventoryFunction

        - LambdaInvokePolicy:
            FunctionName: !Ref ChargePaymentFunction

        - LambdaInvokePolicy:
            FunctionName: !Ref ConfirmOrderFunction

        - LambdaInvokePolicy:
            FunctionName: !Ref InvariantCheckerFunction


  # ============================================================
  # Control API Lambda
  # ============================================================

  ControlApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/control_api/
      Handler: app.lambda_handler

      Environment:
        Variables:
          TABLE_NAME: !Ref CounterFlowTable
          STATE_MACHINE_ARN: !GetAtt CheckoutStateMachine.Arn
          INVARIANT_CHECKER_FUNCTION: !Ref InvariantCheckerFunction
          DEMO_TOKEN: !Ref DemoToken

      Policies:

        # Read execution trace data.
        - DynamoDBReadPolicy:
            TableName: !Ref CounterFlowTable

        # Invoke deterministic invariant checker.
        - LambdaInvokePolicy:
            FunctionName: !Ref InvariantCheckerFunction

        # Start and inspect Step Functions executions.
        - Statement:

            - Effect: Allow
              Action:
                - states:StartExecution
              Resource:
                - !GetAtt CheckoutStateMachine.Arn

            - Effect: Allow
              Action:
                - states:DescribeExecution
              Resource: "*"

      Events:

        # --------------------------------------------------------
        # POST /runs
        # --------------------------------------------------------

        StartRun:
          Type: Api
          Properties:
            RestApiId: !Ref CounterFlowApi
            Path: /runs
            Method: POST


        # --------------------------------------------------------
        # GET /runs/{runId}
        # --------------------------------------------------------

        GetRun:
          Type: Api
          Properties:
            RestApiId: !Ref CounterFlowApi
            Path: /runs/{runId}
            Method: GET


        # --------------------------------------------------------
        # POST /runs/{runId}/compare
        # --------------------------------------------------------

        CompareRun:
          Type: Api
          Properties:
            RestApiId: !Ref CounterFlowApi
            Path: /runs/{runId}/compare
            Method: POST


        # --------------------------------------------------------
        # GET /runs/{runId}/trace
        # --------------------------------------------------------

        GetRunTrace:
          Type: Api
          Properties:
            RestApiId: !Ref CounterFlowApi
            Path: /runs/{runId}/trace
            Method: GET


  # ============================================================
  # CloudWatch Log Retention
  # ============================================================

  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CreateOrderFunction}"
      RetentionInDays: 7


  ReserveInventoryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReserveInventoryFunction}"
      RetentionInDays: 7


  ChargePaymentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChargePaymentFunction}"
      RetentionInDays: 7


  ConfirmOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ConfirmOrderFunction}"
      RetentionInDays: 7


  InvariantCheckerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${InvariantCheckerFunction}"
      RetentionInDays: 7


  ControlApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ControlApiFunction}"
      RetentionInDays: 7


# ==============================================================
# Outputs
# ==============================================================

Outputs:

  ApiUrl:
    Description: CounterFlow API Gateway URL
    Value: !Sub "https://${CounterFlowApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"


  TableName:
    Description: CounterFlow DynamoDB table
    Value: !Ref CounterFlowTable


  StateMachineArn:
    Description: Checkout Step Functions state machine
    Value: !GetAtt CheckoutStateMachine.Arn
